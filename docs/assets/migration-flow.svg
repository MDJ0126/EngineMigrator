<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">EngineMigrator migration workflow</title>
  <desc id="desc">Convert supported scenes, assets and scripts between Unity and Unreal in separate copies, then inspect the results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#737b87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1080" height="360" rx="24" fill="#f5f6f8"/>
  <g font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif" text-anchor="middle">
    <text x="540" y="43" fill="#646c78" font-size="13" font-weight="700" letter-spacing="3">PROJECT MIGRATION</text>
    <g fill="#ffffff" stroke="#d9dde3" stroke-width="1.5">
      <rect x="40" y="95" width="240" height="162" rx="18"/>
      <rect x="800" y="95" width="240" height="162" rx="18" fill="#202328" stroke="#202328"/>
    </g>
    <rect x="370" y="77" width="340" height="198" rx="20" fill="#e8ebef" stroke="#737b87" stroke-width="1.5"/>
    <g fill="none" stroke="#737b87" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M 298 176 H 350"/>
      <path d="M 730 176 H 782"/>
    </g>
    <text x="160" y="156" fill="#25282d" font-size="30" font-weight="700">Unity</text>
    <text x="160" y="192" fill="#606873" font-size="15">Scenes · Assets · C#</text>
    <text x="920" y="156" fill="#f4f5f7" font-size="30" font-weight="700">Unreal</text>
    <text x="920" y="192" fill="#bfc5ce" font-size="15">Maps · Assets · Actors</text>
    <text x="540" y="130" fill="#30363e" font-size="25" font-weight="700">EngineMigrator</text>
    <text x="540" y="170" fill="#444d59" font-size="15">Inspect → Convert supported content</text>
    <path d="M 410 192 H 670" stroke="#cbd1d9"/>
    <text x="540" y="224" fill="#444d59" font-size="16">Object mapping &amp; result reports</text>
    <text x="540" y="311" fill="#606873" font-size="14">Keep originals intact · Work on copies · Convert supported content both ways</text>
    <text x="540" y="337" fill="#7a838f" font-size="12">Concept diagram — not an application screenshot</text>
  </g>
</svg>
